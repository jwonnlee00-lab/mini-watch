name: m5d1-connected
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: sample_db
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample-only-pass
    volumes:
    - sample-data:/var/lib/postgresql/data
    - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U sample -d sample_db
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./api
    environment:
      DB_HOST: db
      DB_NAME: sample_db
      DB_USER: sample
      DB_PASSWORD: sample-only-pass
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./web
    environment:
      API_URL: http://api:5000
    ports:
    - 127.0.0.1:3300:3000
    depends_on:
    - api
volumes:
  sample-data:
    external: true
    name: m5d1-sample-data
