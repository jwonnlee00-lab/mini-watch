{% extends "base.html" %}
{% block content %}
<h1>게시글 수정</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post">
<label for="title">제목</label><input id="title" name="title" value="{{ title }}">
<label for="body">내용</label><textarea id="body" name="body" rows="12">{{ body }}</textarea>
<div class="actions"><button type="submit">저장하기</button><a class="button secondary" href="{{ url_for('posts.detail', post_id=post.id) }}">취소</a></div>
</form>
{% endblock %}
